name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate canonical addresses
        run: python3 -m json.tool addresses.json >/dev/null

      - name: Compile tracked Python modules
        run: |
          python3 - <<'PY'
          import pathlib
          import py_compile
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          for path in paths:
              if not pathlib.PurePosixPath(path).parts[0] == "_archive":
                  py_compile.compile(path, doraise=True)
          PY

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
